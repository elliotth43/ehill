<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minute Cryptic Scores</title>

<link rel="stylesheet" href="styles.css">

<link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">

</head>
<body>

<header>
    <div class="flex-container">
        <a href="/"><h1>Elliott Hill</h1></a>
        <div id="social">
            <a href="https://www.instagram.com/sheffiott/"><img src="images/instagram.png" width="51px" class="socialbutton"></a>
            <a href="https://www.linkedin.com/in/elliotthill143/"><img src="images/linkedin.png" width="60px" class="socialbutton"></a>
        </div>
    </div>
    <nav>
        <ol>
            <li><a href="/">Home</a></li>
            <li><a href="crypticscores">Minute Cryptic Scores</a></li>
        </ol>
    </nav>
</header>

<section>
    <h1>Minute Cryptic Scores</h1>
    <p>This page displays my most recent scores on the daily <a href="https://www.minutecryptic.com/">Minute Cryptic</a> puzzles.</p>
</section>

<div id="cryptic-scores-div"></div>

<script>
  async function loadScores() {
    try {
      // Fetch the json file (adding a timestamp prevents browser caching issues)
      const response = await fetch('crypticscores.json?v=' + Date.now());
      const scores = await response.json();
      scores.reverse(); // newest at the top
    
      // Find the html div
      const container = document.getElementById('cryptic-scores-div');
      container.innerHTML = ''; //clear anything in the div

      // Build an HTML card for every entry in the list
      scores.forEach(entry => {
        const card = document.createElement('section'); //make a div
        card.className = 'cryptic-card'; //give div a class

        const dateElement = document.createElement('h1');
        dateElement.className = 'cryptic-date';
        dateElement.textContent = entry.date;
        card.appendChild(dateElement);

        const textElement = document.createElement('p');
        textElement.className = 'cryptic-text';
        textElement.textContent = entry.text;
        card.appendChild(textElement);


        container.appendChild(card); //add this div to html div
      });
    } catch (error) {
      console.error('Could not load scores:', error);
    }
  }
  // Run the function automatically as soon as the page finishes loading
  document.addEventListener('DOMContentLoaded', loadScores);
</script>

</body>
</html>
